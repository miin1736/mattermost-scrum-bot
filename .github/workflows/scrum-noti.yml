name: Send Mattermost Scrum Notification

on:
  schedule:
    - cron: '30 0 * * 2'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification via Webhook
        env:
          WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: |
          # 1. 시크릿 값 유무 체크 (비어있으면 명시적으로 에러 출력)
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Error: MATTERMOST_WEBHOOK_URL 시크릿이 설정되지 않았거나 비어있습니다."
            exit 1
          fi

          # 2. JSON 데이터 전송 (globbing 방지를 위해 -g 옵션 추가)
          curl -i -X POST -g \
            -H "Content-Type: application/json" \
            -d '{
              "username": "Scrum Bot",
              "icon_emoji": "alarm_clock",
              "text": "### 🔔 화요일 데일리 스크럼 알림\n\n모두 화요일 스크럼 준비해 주세요! (@channel)\n\n* **오늘 할 일 공유**\n* **이슈 및 블로커 공유**"
            }' \
            "$WEBHOOK_URL"
