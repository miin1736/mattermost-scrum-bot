name: Send Mattermost Scrum Notification

on:
  schedule:
    - cron: '30 0 * * 2'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification via Webhook
        env:
          WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: |
          # 1. 시크릿 값 유무 체크 (비어있으면 명시적으로 에러 출력)
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Error: MATTERMOST_WEBHOOK_URL 시크릿이 설정되지 않았거나 비어있습니다."
            exit 1
          fi

          # 2. JSON 데이터 전송 (globbing 방지를 위해 -g 옵션 추가)
          curl -i -X POST -g \
            -H "Content-Type: application/json" \
            -d '{
              "username": "Scrum Assistant",
              "icon_url": "https://img.icons8.com/color/96/calendar--v1.png",
              "text": "@channel",
              "attachments": [
                {
                  "color": "#4A6CF7",
                  "title": "📋 Weekly Scrum Check-in",
                  "text": "오늘의 업무 우선순위와 공유 사항을 정리해 주세요.\n\n* **⏰ 시작 시간** : `09:30 AM`\n* **📊 SCRUM Sheet** : [스프레드시트 바로가기](https://docs.google.com/spreadsheets/d/1tPFi8gjwBAuTD8LQsaHY7ywXUuF5f1zCFFVR_jkXpTc/edit?gid=0#gid=0)"
                }
              ]
            }' \
            "$WEBHOOK_URL"
